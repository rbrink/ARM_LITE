{% block ripper %}
    <div class="tab-pane" id="settings" role="tabpanel" aria-labelledby="settings-tab">
        <div class="settings-section">
            <h2>ARM Lite Ripper Settings</h2>
            <p class="settings-section-hint">Configure the ripper values used by ARM-Lite.</p>
            <form id="ripperSettings" name="ripperSettings" method="post" action="#" class="settings-form" onsubmit="return false;">
                {{ form.hidden_tag() }}
                {% for k, v in settings.items() %}
                    <div class="settings-field settings-inline-field">
                        <label for="{{ k }}">{{ k | replace("_"," ") }}</label>
                        <div class="settings-input-with-btn">
                            <input type="text" id="{{ k }}" aria-label="{{ k }}" name="{{ k }}"
                                   placeholder="{{ v }}" value="{{ v }}" aria-describedby="{{ k }}"
                                   {% if ripper_read_only %}
                                     disabled="" title="arm.yaml is read-only"
                                   {% endif %}>
                            <a class="popovers" onClick='return false;' href=""
                               data-content="{{ jsoncomments[k]| replace("#", "\n") }}" rel="popover"
                               data-placement="top" data-original-title="{{ k }}">
                                <img title="More information" src="{{ url_for('static', filename='img/info.png') }}" width="15px"
                                     height="17px" alt="More Info">
                            </a>
                        </div>
                    </div>
                {% endfor %}
                <div class="settings-footer" style="padding-top: 18px; border-top: 1px solid var(--border); margin-top: 12px;">
                    <div></div>
                    <button id="ripperSettingsSubmit" class="btn btn-secondary" type="button">Submit</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
